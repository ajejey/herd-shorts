name: Daily short

# A day runs in three steps:
#   06:10 UTC  pull yesterday's numbers (games close at 06:00: late play runs 6 h past midnight)
#              and commit data/<day>.json
#   ~06:30     Claude may commit picks/<date>.json; that push renders straight away
#   06:40 UTC  if nothing was rendered for the date, render the strategy's choice
# Each render makes strategy.per_day videos, each with its posting time (ledger post_at, from
# strategy.slots_utc). "Post due Reels" runs straight after a render, then hourly: YouTube gets
# each video at once, scheduled for its post_at; Instagram gets it when its time comes.
on:
  schedule:
    - cron: '10 6 * * *'
    - cron: '40 6 * * *'
  push:
    branches: [main]
    paths: ['picks/**']
  workflow_dispatch:
    inputs:
      day:
        description: 'Herd day (blank: the latest finished day)'
        required: false
      format:
        description: 'Force one format, e.g. B-board (no posting time: post it by hand)'
        required: false
      date:
        description: 'Posting date the videos are for, YYYY-MM-DD (blank: today, UTC)'
        required: false

permissions:
  contents: write
  actions: write # a render starts "Post due Reels" straight away

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  pull:
    if: github.event_name == 'schedule' && github.event.schedule == '10 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the finished day
        env:
          SHORTS_KEY: ${{ secrets.SHORTS_KEY }}
        run: node pipeline/pull-data.mjs
      - name: Commit it for the pick
        run: |
          git config user.name "herd-shorts bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data for the latest finished day"
          git pull --rebase --quiet && git push

  render:
    if: github.event_name != 'schedule' || github.event.schedule == '40 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the finished day (again, in case the morning pull failed)
        env:
          SHORTS_KEY: ${{ secrets.SHORTS_KEY }}
        run: node pipeline/pull-data.mjs ${{ inputs.day && format('--day={0}', inputs.day) || '' }}

      - name: Already rendered today?
        id: seen
        if: github.event_name == 'schedule'
        run: node pipeline/daily.mjs --check-done

      - name: FFmpeg for the renderer
        if: steps.seen.outputs.done != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Chrome for HyperFrames
        if: steps.seen.outputs.done != 'true'
        run: npx --yes hyperframes@0.9.20 browser ensure

      - name: Pipeline checks
        if: steps.seen.outputs.done != 'true'
        run: node pipeline/check.mjs

      - name: Pick, render, record
        id: daily
        if: steps.seen.outputs.done != 'true'
        run: node pipeline/daily.mjs ${{ inputs.day && format('--day={0}', inputs.day) || '' }} ${{ inputs.format && format('--format={0}', inputs.format) || '' }} ${{ inputs.date && format('--date={0}', inputs.date) || '' }}

      - name: Keep the videos for 30 days
        if: steps.daily.outputs.count > 0
        uses: actions/upload-artifact@v4
        with:
          name: day-${{ steps.daily.outputs.day }}-${{ github.run_id }}
          path: |
            renders/*.mp4
            renders/*.jpg
            renders/*.meta.json
          retention-days: 30

      - name: A release per video, with its YouTube copy
        if: steps.daily.outputs.count > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS="$(printf '\t')" read -r id mp4 jpg meta; do
            [ -n "$id" ] || continue
            node pipeline/youtube-kit.mjs --id="$id" > /dev/null
            tag="short-$id"
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$id" --notes "Rendered by the daily workflow."
            gh release upload "$tag" "$mp4" "$jpg" "$meta" "${mp4%.mp4}.youtube.txt" --clobber
          done < renders/manifest.tsv

      - name: Save the data and the ledger rows
        if: steps.daily.outputs.count > 0
        run: |
          git config user.name "herd-shorts bot"
          git config user.email "actions@users.noreply.github.com"
          git add data ledger
          git diff --cached --quiet || git commit -m "Day ${{ steps.daily.outputs.day }}: ${{ steps.daily.outputs.count }} rendered"
          git pull --rebase --quiet && git push

      # Straight to the poster: YouTube schedules each video for its post_at the moment it is
      # rendered, instead of waiting for an hourly run GitHub may drop (13 Nov 2026).
      - name: Hand the videos to Post due Reels
        if: steps.daily.outputs.count > 0 && (vars.AUTO_POST_INSTAGRAM == 'on' || vars.AUTO_POST_YOUTUBE == 'on')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post-due.yml --ref main
