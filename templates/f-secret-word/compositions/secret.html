<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #s-ground {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 900px 900px at 10% 6%, #CFE6F3 0%, rgba(207, 230, 243, 0) 70%),
        radial-gradient(ellipse 1000px 1000px at 95% 98%, #FFE6A6 0%, rgba(255, 230, 166, 0) 70%),
        #FFF6E2;
    }
    #s-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(185, 204, 216, 0.35) 7px, rgba(185, 204, 216, 0) 7.5px);
      background-size: 64px 64px; background-position: 16px 24px;
    }
    .s-cloud { position: absolute; background: url("assets/img/cloud.svg") center / contain no-repeat; }
    #s-cloud1 { left: 40px; top: 120px; width: 230px; height: 115px; }
    #s-cloud2 { left: 780px; top: 1440px; width: 200px; height: 100px; }
    #s-stage { position: absolute; inset: 0; }
    .s-text { position: absolute; left: 90px; width: 900px; }
    .s-w { display: inline-block; }
    #s-kicker { top: 196px; font-family: "Quicksand", sans-serif; font-size: 30px; font-weight: 700; color: #C2306F; letter-spacing: 0.04em; }
    #s-hook, #s-reveal { top: 240px; max-height: 170px; font-size: 68px; font-weight: 700; line-height: 1.08; letter-spacing: -0.01em; }
    #s-word { position: absolute; left: 90px; top: 440px; width: 900px; height: 110px; }
    .s-tile { position: absolute; top: 0; width: 100px; height: 110px; perspective: 700px; }
    .s-blank, .s-face {
      position: absolute; inset: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden; font-size: 64px; font-weight: 700; text-transform: uppercase;
    }
    .s-blank { background: #FFFFFF; border: 4px solid #E0D3BC; color: #8C7A5E; }
    .s-face { background: #E84A8B; color: #FFFFFF; }
    .s-label { font-family: "Quicksand", sans-serif; font-size: 34px; font-weight: 700; color: rgba(45, 24, 16, 0.65); }
    #s-label1 { top: 610px; }
    #s-label2 { top: 850px; }
    .s-chips { position: absolute; left: 90px; width: 900px; display: flex; flex-wrap: wrap; gap: 16px; }
    #s-chips1 { top: 660px; }
    #s-chips2 { top: 900px; }
    .s-chip { display: inline-flex; align-items: baseline; gap: 12px; padding: 10px 26px 12px; border-radius: 40px; white-space: nowrap; }
    .s-chip b { font-size: 48px; font-weight: 700; }
    .s-chip i { font-style: normal; font-family: "Quicksand", sans-serif; font-size: 30px; font-weight: 700; opacity: 0.75; }
    .s-cold { background: #E3F0F8; border: 3px solid #B9CCD8; color: #2B5A78; }
    .s-warm { background: #FFE6F0; border: 3px solid #F6C9DA; color: #A8205E; }
    #s-stat { top: 1150px; white-space: nowrap; font-size: 56px; font-weight: 700; }
    #s-stat2 { top: 1222px; white-space: nowrap; font-family: "Quicksand", sans-serif; font-size: 40px; font-weight: 700; }
    #s-cta { top: 1150px; white-space: nowrap; font-family: "Quicksand", sans-serif; font-size: 40px; font-weight: 700; }
  </style>

  <div id="root" data-composition-id="secret" data-width="1080" data-height="1920">
    <div id="s-ground"></div>
    <div id="s-dots"></div>
    <div id="s-cloud1" class="s-cloud"></div>
    <div id="s-cloud2" class="s-cloud"></div>

    <div id="s-stage">
      <div id="s-kicker" class="s-text"></div>
      <!-- Hook: frame 0 is the thumbnail, the hidden word's tiles under it -->
      <div id="s-hook" class="s-text clip" data-start="0" data-duration="7.9" data-track-index="1"></div>
      <div id="s-reveal" class="s-text clip" data-start="7.75" data-duration="9.85" data-track-index="2"></div>
      <div id="s-word"></div>
      <div id="s-label1" class="s-text s-label">Most people started with</div>
      <div id="s-chips1" class="s-chips"></div>
      <div id="s-label2" class="s-text s-label">So close, but no</div>
      <div id="s-chips2" class="s-chips"></div>
      <div id="s-stat" class="s-text clip" data-start="10.55" data-duration="3.1" data-track-index="3"></div>
      <div id="s-stat2" class="s-text clip" data-start="11.3" data-duration="2.35" data-track-index="4"></div>
      <div id="s-cta" class="s-text clip" data-start="13.75" data-duration="3.85" data-track-index="5"></div>
    </div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V;
      const WORD = String(V.word);
      const pairs = (s) => String(s || "").split("|").filter(Boolean).map((p) => { const i = p.lastIndexOf(":"); return { value: p.slice(0, i), count: Number(p.slice(i + 1)) }; });
      const FIRSTS = pairs(V.firsts), CLOSES = pairs(V.closes);
      const TIMES = String(V.chipTimes).split(",").map(Number);   // first guesses, then close calls

      document.getElementById("s-kicker").textContent = ("Secret Word · " + V.date).toUpperCase();
      const hookWords = H.words("s-hook", V.hook, "s-w");
      const revealWords = H.words("s-reveal", V.reveal, "s-w");
      const statWords = H.words("s-stat", V.stat, "s-w");
      const stat2Words = H.words("s-stat2", V.stat2, "s-w");
      const ctaWords = H.words("s-cta", V.cta, "s-w");

      // The hidden word: one tile per letter, centred
      const n = WORD.length, TW = 100, GAP = 10;
      const left0 = (900 - (n * TW + (n - 1) * GAP)) / 2;
      const wordEl = document.getElementById("s-word");
      const tiles = WORD.split("").map((ch, i) => {
        const t = document.createElement("div");
        t.className = "s-tile"; t.style.left = left0 + i * (TW + GAP) + "px";
        t.innerHTML = '<div class="s-blank">?</div><div class="s-face"></div>';
        t.querySelector(".s-face").textContent = ch;
        wordEl.appendChild(t);
        return { blank: t.querySelector(".s-blank"), face: t.querySelector(".s-face") };
      });

      const chip = (box, x, cls) => {
        const c = document.createElement("div");
        c.className = "s-chip " + cls;
        c.innerHTML = "<b></b><i></i>";
        c.querySelector("b").textContent = x.value;
        c.querySelector("i").textContent = H.num(x.count);
        box.appendChild(c);
        return c;
      };
      const cold = FIRSTS.map((x) => chip(document.getElementById("s-chips1"), x, "s-cold"));
      const warm = CLOSES.map((x) => chip(document.getElementById("s-chips2"), x, "s-warm"));

      H.fontsReady().then(() => {
        H.fit("s-hook", { max: 68, min: 48, maxH: 170 });
        H.fit("s-reveal", { max: 68, min: 48, maxH: 170 });
        H.fit("s-stat", { max: 56, min: 36 });
        H.fit("s-stat2", { max: 40, min: 28 });
        H.fit("s-cta", { max: 40, min: 28 });

        const tl = gsap.timeline({ paused: true });
        // Each face is hidden until its own flip (edge-on it still counts as covering the "?")
        tiles.forEach((x) => gsap.set(x.face, { rotationX: 90, visibility: "hidden" }));
        gsap.set([...cold, ...warm, "#s-label1", "#s-label2"], { opacity: 0 });

        // Clouds drift (the world)
        tl.fromTo("#s-cloud1", { x: 0 }, { x: 100, duration: 17.6, ease: "none" }, 0);
        tl.fromTo("#s-cloud2", { x: 0 }, { x: -84, duration: 17.6, ease: "none" }, 0);
        // The hidden tiles wobble while the hook is read
        tl.fromTo(tiles.map((x) => x.blank), { y: 0 }, { keyframes: { y: [0, -10, 0] }, duration: 0.4, stagger: 0.08, ease: "none" }, 0.4);

        // Where the herd started (cold), then how close it came (warm)
        tl.fromTo("#s-label1", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.4);
        cold.forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, TIMES[i]));
        tl.fromTo("#s-label2", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.6);
        warm.forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, TIMES[cold.length + i]));

        // The reveal: the tiles flip to the word
        tl.to(hookWords, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.02, ease: "power2.in" }, 7.6);
        tl.fromTo(revealWords, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 7.8);
        tl.fromTo(tiles.map((x) => x.blank), { rotationX: 0 }, { rotationX: -90, duration: 0.14, ease: "power2.in", stagger: 0.07 }, 9.0);
        tiles.forEach((x, i) => {
          tl.set(x.face, { visibility: "visible" }, 9.14 + i * 0.07);
          tl.set(x.blank, { visibility: "hidden" }, 9.14 + i * 0.07);
        });
        tl.fromTo(tiles.map((x) => x.face), { rotationX: 90 }, { rotationX: 0, duration: 0.26, ease: "back.out(1.6)", stagger: 0.07 }, 9.14);
        tl.to([...cold, "#s-label1"], { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 9.3);
        tl.fromTo(statWords, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 10.6);
        tl.fromTo(stat2Words, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 11.35);
        tl.to([...statWords, ...stat2Words], { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.02, ease: "power2.in" }, 13.45);
        tl.fromTo(ctaWords, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 13.8);

        // Hand-off to the end card
        tl.to("#s-stage", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 17.2);

        window.__timelines["secret"] = tl;
      });
    })();
  </script>
</template>
