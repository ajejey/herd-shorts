<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"date","type":"string","label":"Date","default":"10 Nov 2026"},
    {"id":"hook","type":"string","label":"Hook (frame 0)","default":"The herd needed 36 guesses. Can you beat that?"},
    {"id":"word","type":"string","label":"The secret word","default":"tape"},
    {"id":"firsts","type":"string","label":"First guesses (word:count|…)","default":"ocean:20|sea:16|animal:12"},
    {"id":"closes","type":"string","label":"Close calls (word:count|…)","default":"video:32|glue:24|plastic:14|recording:11"},
    {"id":"chipTimes","type":"string","label":"When each chip pops (s)","default":"1.700,2.100,2.500,4.900,5.300,5.700,6.100"},
    {"id":"reveal","type":"string","label":"Line before the word","default":"The secret word was…"},
    {"id":"stat","type":"string","label":"Stat","default":"117 of 261 found it"},
    {"id":"stat2","type":"string","label":"Second stat","default":"Someone got it in 1 guess"},
    {"id":"cta","type":"string","label":"Call to comment","default":"How many guesses would you need? Comment it."},
    {"id":"endHead","type":"string","label":"End card headline","default":"Find today’s word"},
    {"id":"endGame","type":"string","label":"End card game line","default":"Secret Word · a new word every day"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E2; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.6" data-width="1080" data-height="1920">
      <div id="secret" data-composition-id="secret" data-composition-src="compositions/secret.html"
        data-start="0" data-duration="17.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="17.450000000000003" data-duration="3.15" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Sound: no music bed; effects only, each peak one frame after its picture -->
      <audio id="snd-chip" data-each="chipTimes" class="clip" src="assets/sfx/sfx_005.mp3" data-start="1.7" data-duration="0.2" data-track-index="10" data-volume="0.6"></audio>
      <audio id="snd-riser" class="clip" src="assets/sfx/sfx_002.mp3" data-start="7.05" data-duration="2" data-track-index="12" data-volume="0.55"></audio>
      <audio id="snd-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="9.05" data-duration="2.1" data-track-index="13" data-volume="0.9"></audio>
      <audio id="snd-stat" class="clip" src="assets/sfx/pop.mp3" data-start="10.62" data-duration="0.6" data-track-index="14" data-volume="0.7"></audio>
      <audio id="snd-cta" class="clip" src="assets/sfx/sfx_001.mp3" data-start="13.82" data-duration="0.45" data-track-index="15" data-volume="0.6"></audio>
      <audio id="snd-end-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.350" data-duration="0.575" data-track-index="16" data-volume="0.6"></audio>
      <audio id="snd-end-pop" class="clip" src="assets/sfx/pop.mp3" data-start="18.313" data-duration="0.6" data-track-index="17" data-volume="0.7"></audio>
    </div>
    <script src="assets/herd.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
