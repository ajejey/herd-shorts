<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #d-ground { position: absolute; inset: 0; background: linear-gradient(180deg, #BFE3F7 0%, #E9F4E8 45%, #FFE58F 100%); }
    #d-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.55) 7px, rgba(255, 255, 255, 0) 7.5px);
      background-size: 64px 64px; background-position: 16px 24px;
    }
    #d-stage { position: absolute; inset: 0; }
    .d-c { position: absolute; left: 70px; width: 940px; text-align: center; }
    .d-w { display: inline-block; }

    /* The series tag; at the end it becomes the address */
    .d-pill { position: absolute; top: 196px; left: 290px; width: 500px; text-align: center; padding: 10px 0 12px; border-radius: 40px; white-space: nowrap;
      font-family: "Quicksand", sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 0.05em; color: #FFFFFF; }
    #d-tag { background: #E84A8B; }

    /* The line above the card: hook, then "got it yet?", then "final answer?", then the answer */
    .d-head { display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
    /* The challenge: on screen for the whole video, so anyone arriving late knows what this is */
    #d-hook { top: 206px; height: 200px; font-size: 84px; }
    /* The slot under it: "got it yet?", "final answer?", then the answer */
    #d-mid, #d-final, #d-answer { top: 424px; height: 120px; }
    #d-answer { color: #C2306F; white-space: nowrap; font-size: 116px; }

    #d-card { position: absolute; left: 190px; top: 584px; width: 700px; height: 700px; background: #FFFFFF; border: 6px solid #2D1810; border-radius: 36px; box-shadow: 0 14px 0 rgba(45, 24, 16, 0.18); }
    #d-art { position: absolute; left: 238px; top: 618px; width: 604px; height: 604px; overflow: visible; }
    #d-art path { fill: none; stroke: #2D1810; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    #d-credit { position: absolute; left: 196px; top: 1240px; width: 688px; text-align: center; font-family: "Quicksand", sans-serif; font-size: 22px; font-weight: 600; color: rgba(45, 24, 16, 0.6); }
    #d-badge { position: absolute; left: 156px; top: 556px; padding: 8px 22px 10px; border-radius: 30px; background: #2D1810; color: #FFFFFF; font-size: 40px; font-weight: 700; white-space: nowrap; }

    /* The final-answer timer: a ring that empties, the number inside */
    #d-timer { position: absolute; left: 818px; top: 640px; width: 200px; height: 200px; }
    #d-timer-num { position: absolute; left: 818px; top: 640px; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 110px; font-weight: 700; color: #C2306F; }

    /* The herd meter: how many players had it by this line, a sheep riding the fill */
    #d-cow { position: absolute; left: 34px; top: 1300px; width: 176px; height: 176px; background: url("assets/img/cow.svg") center / contain no-repeat; }
    #d-bubble { position: absolute; left: 150px; top: 1272px; width: 70px; height: 62px; border-radius: 31px; background: #FFFFFF; border: 4px solid #2D1810;
      display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; }
    #d-meter-label { position: absolute; left: 226px; top: 1312px; width: 764px; font-family: "Quicksand", sans-serif; font-size: 44px; font-weight: 700; white-space: nowrap; }
    #d-meter-label b { color: #2F6E45; }
    /* After the reveal the meter tells the story: back to the line-1 share, in pink */
    #d-meter-label.d-is-sting { font-size: 46px; }
    #d-meter-label.d-is-sting b { color: #C2306F; }
    #d-bar { position: absolute; left: 226px; top: 1376px; width: 660px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.85); border: 4px solid #2D1810; overflow: hidden; }
    #d-fill { position: absolute; left: 0; top: 0; height: 100%; width: 660px; background: #3D8B5A; transform-origin: 0 50%; }
    #d-rider { position: absolute; left: 0; top: 1371px; width: 52px; height: 52px; background: url("assets/img/sheep.svg") center / contain no-repeat; }

    /* After the reveal: how the herd did, then the comment line */
    .d-low { font-weight: 700; line-height: 1.12; white-space: nowrap; }
    #d-cta { top: 1446px; font-size: 56px; }
    /* The last beat: the invitation to play, the address big enough to remember and type */
    #d-play { position: absolute; left: 50px; top: 1290px; width: 980px; height: 290px; z-index: 20; border-radius: 44px; background: #E84A8B; border: 6px solid #2D1810;
      box-shadow: 0 14px 0 rgba(45, 24, 16, 0.22); color: #FFFFFF; text-align: center; }
    #d-play-1 { position: absolute; left: 0; top: 34px; width: 100%; font-family: "Quicksand", sans-serif; font-size: 48px; font-weight: 700; }
    #d-play-2 { position: absolute; left: 30px; top: 112px; width: 920px; white-space: nowrap; font-size: 92px; font-weight: 700; letter-spacing: -0.01em; }
    .d-low b { color: #C2306F; }

    .d-bit { position: absolute; width: 18px; height: 30px; border-radius: 4px; }

    /* Decoration only, under the platform's top bar and bottom caption: nothing to read here */
    .d-cloud { position: absolute; background: url("assets/img/cloud.svg") center / contain no-repeat; }
    #d-cloud1 { left: 60px; top: 70px; width: 240px; height: 120px; }
    #d-cloud2 { left: 760px; top: 120px; width: 200px; height: 100px; }
    #d-hill { position: absolute; left: 0; top: 1600px; width: 1080px; height: 320px; }
    .d-sheep { position: absolute; width: 150px; height: 150px; background: url("assets/img/sheep.svg") center / contain no-repeat; }
  </style>

  <div id="root" data-composition-id="doodle" data-width="1080" data-height="1920">
    <div id="d-world" style="position:absolute;inset:0"></div>

    <div id="d-stage">

      <!-- Frame 0 is the thumbnail: the challenge, the first line already drawn -->
      <div id="d-hook" class="d-c d-head"><div id="d-hook-t"></div></div>
      <div id="d-mid" class="d-c d-head clip" data-start="2.8" data-duration="3.85" data-track-index="4"><div id="d-mid-t"></div></div>
      <div id="d-final" class="d-c d-head clip" data-start="6.6" data-duration="3.2" data-track-index="5"><div id="d-final-t"></div></div>
      <div id="d-answer" class="d-c d-head clip" data-start="9.9" data-duration="5.55" data-track-index="6"><span id="d-answer-in"></span></div>

      <div id="d-card"></div>
      <svg id="d-art" viewBox="0 0 256 256"></svg>
      <div id="d-credit"></div>
      <div id="d-badge"></div>

      <svg id="d-timer" class="clip" data-start="6.5" data-duration="3.4" data-track-index="7" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="86" fill="#FFFFFF" stroke="#2D1810" stroke-width="8" />
        <circle id="d-ring" cx="100" cy="100" r="70" fill="none" stroke="#E84A8B" stroke-width="18" stroke-linecap="round" transform="rotate(-90 100 100)" />
      </svg>
      <div id="d-timer-num" class="clip" data-start="6.5" data-duration="3.4" data-track-index="8"><span id="d-n">3</span></div>

      <div id="d-hostbox"></div>
      <div id="d-meter-label"></div>
      <div id="d-bar"><div id="d-fill"></div></div>
      <div id="d-rider"></div>

      <div id="d-cta" class="d-c d-low clip" data-start="11.05" data-duration="2.2" data-track-index="10"></div>
      <div id="d-play" class="clip" data-start="13.15" data-duration="2.45" data-track-index="11"><div id="d-play-1"></div><div id="d-play-2"></div></div>

      <div id="d-confetti" data-layout-allow-overflow></div>
    </div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V, K = H.kit(), A = K.anim;
      const world = K.world(document.getElementById("d-world"));
      const host = K.host(document.getElementById("d-hostbox"));
      // Commentary on the result; under the question here (the meter bar sits where the other formats put it)
      const insight = K.insight(document.getElementById("d-hostbox"), V.insight);
      insight.style.top = "1526px"; insight.style.left = "70px"; insight.style.width = "940px"; insight.style.textAlign = "center";
      const STROKES = String(V.strokes).split("|").map((s) => s.split(",").map(Number));
      const N = STROKES.length;
      const GOT = String(V.gotByLine).split(",").map(Number);
      const CUM = GOT.reduce((a, g) => a.concat((a.length ? a[a.length - 1] : 0) + g), []);
      const TIMES = [0].concat(String(V.lineTimes).split(",").filter(Boolean).map(Number));   // line k starts at TIMES[k]
      const P = V.players;
      const BAR = 660, X0 = 226;   // the meter bar's width and left edge
      const T = { count: 6.6, reveal: 9.9, sting: 10.6, ask: 11.1, play: 13.2, rewind: 15.3, end: 16.1 };

      document.getElementById("d-play-1").textContent = V.play;
      document.getElementById("d-play-2").textContent = V.url;
      const hookW = H.words("d-hook-t", V.hook, "d-w");
      const hookKey = hookW[hookW.length - 1];   // "line 3?": the deadline, lit up when line 3 arrives
      const midW = H.words("d-mid-t", V.mid, "d-w");
      const finalW = H.words("d-final-t", V.final, "d-w");
      document.getElementById("d-answer-in").textContent = V.answer;
      document.getElementById("d-credit").textContent = V.credit;
      // The sting, shown in the meter's label after the reveal: its first number picked out
      const STING = String(V.sting).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/(\d[\d,]*)/, "<b>$1</b>");
      const ctaW = H.words("d-cta", V.ask, "d-w");

      // The doodle, one path per line, in Quick, Draw!'s 256-unit square
      const art = document.getElementById("d-art");
      const paths = STROKES.map((pts) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        let d = "M " + pts[0] + " " + pts[1];
        for (let i = 2; i < pts.length; i += 2) d += " L " + pts[i] + " " + pts[i + 1];
        if (pts.length <= 2) d += " L " + (pts[0] + 0.5) + " " + pts[1];
        p.setAttribute("d", d);
        art.appendChild(p);
        return p;
      });

      // Which line is up, and the herd meter, as functions of time (the rewind sends both back to line 1)
      const badge = document.getElementById("d-badge"), label = document.getElementById("d-meter-label");
      const lineAt = (t) => { if (t >= T.rewind + 0.5) return 0; let k = 0; while (k + 1 < N && t >= TIMES[k + 1]) k++; return k; };
      const clock = { t: 0 };
      const show = () => {
        const t = clock.t, k = lineAt(t);
        // Line 3 is the challenge's deadline: its badge turns pink
        badge.textContent = "LINE " + (k + 1);
        badge.style.background = k === 2 && t < T.reveal ? "#E84A8B" : "#2D1810";
        let got, sting = false;
        if (t >= T.rewind) got = CUM[0];
        else if (t >= T.sting) { sting = true; const p = Math.min(1, (t - T.sting) / 0.5); got = CUM[N - 1] + (CUM[0] - CUM[N - 1]) * p; }
        else if (k === 0) got = CUM[0];
        else { const p = Math.min(1, (t - TIMES[k]) / 0.35); got = CUM[k - 1] + (CUM[k] - CUM[k - 1]) * p; }
        got = Math.round(got);
        // Who the number is and by when, so a stranger can read it cold
        label.innerHTML = sting ? STING : "<b>" + H.num(got) + "</b> of " + H.num(P) + " players had it by line " + (k + 1);
        label.className = sting ? "d-is-sting" : "";
        document.getElementById("d-fill").style.background = sting ? "#E84A8B" : "#3D8B5A";
        const w = BAR * Math.max(0.04, got / P);
        gsap.set("#d-fill", { scaleX: w / BAR });
        gsap.set("#d-rider", { x: X0 + w - 26 });
      };

      // The reveal's celebration (confetti, stars or a stampede, rotated by day)
      const bits = K.confetti(document.getElementById("d-confetti"), 531, 925, 44, 11);

      H.fontsReady().then(() => {
        H.fit("d-hook", { max: 84, min: 58, maxH: 200 });
        ["d-mid", "d-final"].forEach((id) => H.fit(id, { max: 72, min: 50, maxH: 120 }));
        H.fit("d-answer", { max: 108, min: 64 });
        H.fit("d-cta", { max: 56, min: 34 });
        H.fit("d-play-2", { max: 92, min: 56 });
        const lens = paths.map((p) => p.getTotalLength() + 1);
        const RING = 2 * Math.PI * 70;

        const tl = gsap.timeline({ paused: true });
        show();
        tl.fromTo(clock, { t: 0 }, { t: T.end, duration: T.end, ease: "none", onUpdate: show }, 0);
        gsap.set("#d-badge", { rotation: -6 });

        // The challenge pops in word by word in the first ~0.8 s (motion is what stops a scroll), then stays
        tl.fromTo(hookW, { opacity: 0, scale: 1.5, y: -14 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "back.out(2.2)" }, 0.02);
        // While line 3 is up, its words in the challenge light up with the badge; once line 4 starts the deadline has passed
        if (TIMES[2]) {
          tl.to(hookKey, { color: "#C2306F", duration: 0.15 }, TIMES[2]);
          // Grows to the right from its left edge, so it never runs into "before"
          tl.fromTo(hookKey, { scale: 1 }, { keyframes: { scale: [1, 1.2, 1] }, duration: 0.35, ease: "none", transformOrigin: "0% 60%" }, TIMES[2]);
          tl.to(hookKey, { color: "#2D1810", duration: 0.2 }, TIMES[3] || T.count);
        }

        // Line 1 is there at frame 0; each next line draws in its slot (fast once past line 3)
        paths.forEach((p, k) => {
          if (k === 0) { gsap.set(p, { strokeDasharray: lens[0], strokeDashoffset: 0 }); return; }
          const slot = (TIMES[k + 1] || T.count - 0.1) - TIMES[k];
          tl.fromTo(p, { strokeDasharray: lens[k], strokeDashoffset: lens[k] }, { strokeDashoffset: 0, duration: Math.max(0.16, Math.min(0.85, slot * 0.85)), ease: "power1.inOut" }, TIMES[k]);
          tl.fromTo("#d-badge", { scale: 1 }, { keyframes: { scale: [1, 1.18, 1] }, duration: 0.24, ease: "none" }, TIMES[k]);
        });

        // The world (clouds, falling snow/leaves/blossom, the flock) and the cow host (its reaction rotates by day)
        A.world(tl, world, T);
        A.host(tl, host, T);

        // The line above the card changes at line 3 (a pattern break) and again for the countdown
        tl.fromTo(midW, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.28, stagger: 0.06, ease: "back.out(2)" }, 2.85);
        tl.to(midW, { opacity: 0, y: -20, duration: 0.15, stagger: 0.02, ease: "power2.in" }, 6.45);
        tl.fromTo(finalW, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.28, stagger: 0.06, ease: "back.out(2)" }, 6.65);

        // 3, 2, 1: the ring empties, the number pops each second
        tl.fromTo("#d-ring", { strokeDasharray: RING, strokeDashoffset: 0 }, { strokeDashoffset: RING, duration: 3.0, ease: "none" }, T.count);
        tl.fromTo(["#d-timer", "#d-timer-num"], { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 50%" }, 6.5);
        [3, 2, 1].forEach((n, i) => {
          tl.set("#d-n", { textContent: String(n) }, T.count + i);
          tl.fromTo("#d-n", { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, T.count + i);
        });
        tl.to(["#d-timer", "#d-timer-num"], { scale: 0, duration: 0.15, ease: "power2.in", transformOrigin: "50% 50%" }, 9.62);
        // The held breath before the answer
        tl.fromTo(["#d-card", "#d-art"], { x: 0 }, { keyframes: { x: [0, -6, 6, -6, 6, 0] }, duration: 0.25, ease: "none" }, 9.62);

        // The reveal: the word slams in, the drawing goes pink, the card punches in, confetti
        tl.to(finalW, { opacity: 0, duration: 0.08 }, 9.82);
        tl.fromTo("#d-answer-in", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", transformOrigin: "50% 50%" }, T.reveal);
        tl.fromTo(["#d-card", "#d-art"], { scale: 1 }, { keyframes: { scale: [1, 1.07, 1] }, duration: 0.45, ease: "none", transformOrigin: "50% 50%" }, T.reveal);
        tl.to(paths, { stroke: "#E84A8B", duration: 0.2, ease: "power2.out" }, T.reveal);
        A.burst(tl, bits, T.reveal);


        // How the herd did, then the comment line
        tl.fromTo("#d-bar", { scale: 1 }, { keyframes: { scale: [1, 1.04, 1] }, duration: 0.35, ease: "none" }, T.sting);
        tl.fromTo(ctaW, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.22, stagger: 0.05, ease: "back.out(1.6)" }, T.ask);
        A.insight(tl, insight, T);
        // The invitation to play rises over the meter, the address pulses once
        tl.to(ctaW, { opacity: 0, duration: 0.12 }, T.play - 0.1);
        // The banner covers the meter row: that row steps out under it and back in for the rewind
        const UNDER = ["#d-meter-label", "#d-bar", "#d-rider", host.cow, host.bubble];
        tl.to(UNDER, { opacity: 0, duration: 0.15 }, T.play - 0.1);
        tl.to(UNDER, { opacity: 1, duration: 0.2 }, T.rewind + 0.2);
        tl.fromTo("#d-play", { y: 420 }, { y: 0, duration: 0.42, ease: "back.out(1.4)" }, T.play);
        tl.fromTo("#d-play-2", { scale: 1 }, { keyframes: { scale: [1, 1.08, 1] }, duration: 0.4, ease: "none", transformOrigin: "50% 50%" }, T.play + 0.75);

        // Rewind to frame 0 so the loop is seamless: lines undraw, the drawing goes back to ink
        tl.to("#d-play", { y: 420, duration: 0.3, ease: "power2.in" }, T.rewind);
        tl.to("#d-answer-in", { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in" }, T.rewind);
        for (let k = N - 1; k >= 1; k--) tl.to(paths[k], { strokeDashoffset: lens[k], duration: 0.08, ease: "none" }, T.rewind + (N - 1 - k) * (0.5 / Math.max(1, N - 1)));
        tl.to(paths, { stroke: "#2D1810", duration: 0.2, ease: "none" }, T.rewind);
        // The challenge pops out at the very end, so the loop restarts on the same pop-in
        tl.to(hookW, { opacity: 0, scale: 0.6, duration: 0.14, stagger: 0.03, ease: "power2.in" }, T.end - 0.42);
        // Something moves in the first half second: the line badge pops
        tl.fromTo("#d-badge", { scale: 1 }, { keyframes: { scale: [1, 1.22, 1] }, duration: 0.3, ease: "none" }, 0.35);

        window.__timelines["doodle"] = tl;
      });
    })();
  </script>
</template>
