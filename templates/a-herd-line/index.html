<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Text","default":"#2D1810"},
    {"id":"color-accent","type":"color","label":"Accent (answer)","default":"#E84A8B"},
    {"id":"color-green","type":"color","label":"Link green","default":"#3D8B5A"},
    {"id":"font-display","type":"string","label":"Display font","default":"Fredoka"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E2; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <!-- Scenes -->
      <div id="line" data-composition-id="line" data-composition-src="compositions/line.html"
        data-start="0" data-duration="17" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="16.85" data-duration="3.15" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Sound: no music bed (no source); effects only, each peak one frame after its picture -->
      <audio id="snd-count3" class="clip" src="assets/sfx/pop.mp3" data-start="0" data-media-start="0.087" data-duration="0.6" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-count2" class="clip" src="assets/sfx/pop.mp3" data-start="1.243" data-duration="0.6" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-count1" class="clip" src="assets/sfx/pop.mp3" data-start="2.583" data-duration="0.6" data-track-index="10" data-volume="0.7"></audio>

      <audio id="snd-land1" class="clip" src="assets/sfx/sfx_005.mp3" data-start="4.73" data-duration="0.2" data-track-index="11" data-volume="0.55"></audio>
      <audio id="snd-land2" class="clip" src="assets/sfx/sfx_001.mp3" data-start="5.03" data-duration="0.45" data-track-index="12" data-volume="0.4"></audio>
      <audio id="snd-land3" class="clip" src="assets/sfx/sfx_005.mp3" data-start="5.31" data-duration="0.2" data-track-index="11" data-volume="0.5"></audio>
      <audio id="snd-land4" class="clip" src="assets/sfx/sfx_001.mp3" data-start="5.58" data-duration="0.45" data-track-index="12" data-volume="0.4"></audio>
      <audio id="snd-land5" class="clip" src="assets/sfx/sfx_005.mp3" data-start="5.86" data-duration="0.2" data-track-index="11" data-volume="0.5"></audio>
      <audio id="snd-land6" class="clip" src="assets/sfx/sfx_001.mp3" data-start="6.17" data-duration="0.45" data-track-index="12" data-volume="0.35"></audio>
      <audio id="snd-land7" class="clip" src="assets/sfx/sfx_005.mp3" data-start="6.47" data-duration="0.2" data-track-index="11" data-volume="0.45"></audio>
      <audio id="snd-land8" class="clip" src="assets/sfx/sfx_001.mp3" data-start="6.76" data-duration="0.45" data-track-index="12" data-volume="0.35"></audio>

      <audio id="snd-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.3" data-duration="0.575" data-track-index="13" data-volume="0.8"></audio>
      <audio id="snd-riser" class="clip" src="assets/sfx/sfx_002.mp3" data-start="8.458" data-duration="2" data-track-index="14" data-volume="0.55"></audio>
      <audio id="snd-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="10.36" data-duration="2.1" data-track-index="15" data-volume="0.9"></audio>
      <audio id="snd-exact" class="clip" src="assets/sfx/sfx_001.mp3" data-start="13.03" data-duration="0.45" data-track-index="12" data-volume="0.7"></audio>
      <audio id="snd-end-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.75" data-duration="0.575" data-track-index="13" data-volume="0.6"></audio>
      <audio id="snd-end-pop" class="clip" src="assets/sfx/pop.mp3" data-start="17.713" data-duration="0.6" data-track-index="10" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
