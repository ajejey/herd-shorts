<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #a-ground {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 900px 900px at 10% 6%, #CFE6F3 0%, rgba(207, 230, 243, 0) 70%),
        radial-gradient(ellipse 1000px 1000px at 95% 98%, #FFE6A6 0%, rgba(255, 230, 166, 0) 70%),
        #FFF6E2;
    }
    #a-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(185, 204, 216, 0.35) 7px, rgba(185, 204, 216, 0) 7.5px);
      background-size: 64px 64px; background-position: 16px 24px;
    }
    .a-cloud { position: absolute; background: url("assets/img/cloud.svg") center / contain no-repeat; }
    #a-cloud1 { left: 40px; top: 120px; width: 230px; height: 115px; }
    #a-cloud2 { left: 780px; top: 1440px; width: 200px; height: 100px; }
    #a-stage { position: absolute; inset: 0; }
    .a-text { position: absolute; left: 90px; z-index: 5; }
    .a-w { display: inline-block; }
    #a-q { top: 300px; width: 900px; max-height: 420px; font-size: 86px; font-weight: 700; line-height: 1.08; letter-spacing: -0.01em; }
    #a-sub { top: 820px; font-family: "Quicksand", sans-serif; font-size: 44px; font-weight: 700; }
    #a-count { top: 730px; left: 760px; width: 200px; height: 280px; }
    .a-num { position: absolute; left: 0; top: 0; width: 200px; text-align: center; font-size: 260px; font-weight: 700; line-height: 1; }
    #a-ctx { top: 180px; width: 900px; max-height: 80px; font-family: "Quicksand", sans-serif; font-size: 32px; font-weight: 700; line-height: 1.2; color: rgba(45, 24, 16, 0.72); }
    #a-l1, #a-l2 { top: 350px; width: 880px; max-height: 170px; font-size: 76px; font-weight: 700; line-height: 1.08; }
    #a-tag { top: 650px; left: 222px; font-size: 52px; font-weight: 600; white-space: nowrap; }
    .a-arrow { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; z-index: 5; pointer-events: none; }
    #a-ans { top: 340px; width: 900px; }
    #a-ans-num { white-space: nowrap; font-size: 240px; font-weight: 700; line-height: 1; color: #E84A8B; letter-spacing: -0.02em; }
    #a-ans-unit { font-size: 64px; font-weight: 700; line-height: 1.1; margin-top: 10px; white-space: nowrap; }
    #a-fact { top: 690px; width: 900px; max-height: 96px; font-family: "Quicksand", sans-serif; font-size: 40px; font-weight: 700; line-height: 1.2; }
    #a-exact-label { top: 796px; width: 900px; white-space: nowrap; font-size: 52px; font-weight: 600; line-height: 1.1; }
    #a-source { top: 244px; white-space: nowrap; font-family: "Quicksand", sans-serif; font-size: 28px; font-weight: 600; color: rgba(45, 24, 16, 0.6); }
    #a-axis { position: absolute; left: 90px; top: 1230px; width: 810px; height: 8px; border-radius: 4px; background: #2D1810; }
    .a-tick { position: absolute; left: 0; top: 1238px; width: 4px; height: 18px; background: #2D1810; border-radius: 2px; }
    .a-tick-label { position: absolute; left: 0; top: 1258px; font-family: "Quicksand", sans-serif; font-size: 32px; font-weight: 700; white-space: nowrap; }
    #a-herd { position: absolute; inset: 0; z-index: 2; }
    .a-sheep { position: absolute; width: 60px; height: 60px; background: url("assets/img/sheep.svg") center / contain no-repeat; }
    .a-sheep.pink { background-image: url("assets/img/sheep-pink.svg"); }
    #a-flag { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 1; }
    #a-pole { position: absolute; left: 897px; top: 930px; width: 6px; height: 300px; background: #2D1810; border-radius: 3px; }
    #a-pennant { position: absolute; left: 783px; top: 932px; width: 116px; height: 86px; }
  </style>

  <div id="root" data-composition-id="line" data-width="1080" data-height="1920">
    <div id="a-ground"></div>
    <div id="a-dots"></div>
    <div id="a-cloud1" class="a-cloud"></div>
    <div id="a-cloud2" class="a-cloud"></div>

    <div id="a-stage">
      <!-- The world: the number line, its ticks and the herd -->
      <div id="a-axis"></div>
      <div id="a-ticks" data-layout-allow-overflow></div>
      <div id="a-flag" class="clip" data-start="9.9" data-duration="7.1" data-track-index="14">
        <div id="a-flag-in">
          <div id="a-pole"></div>
          <svg id="a-pennant" viewBox="0 0 116 86"><path id="a-pennant-path" d="M 116 0 L 116 86 L 0 43 Z" fill="#E84A8B" /></svg>
        </div>
      </div>
      <div id="a-herd" data-layout-allow-overflow class="clip" data-start="4.3" data-duration="12.6" data-track-index="13"></div>

      <!-- Hook: frame 0 is the thumbnail -->
      <div id="a-q" class="a-text clip" data-start="0" data-duration="4.3" data-track-index="1"></div>
      <div id="a-sub" class="a-text clip" data-start="0" data-duration="4.3" data-track-index="2"><span id="a-sub-in"></span></div>
      <div id="a-count" class="a-text clip" data-start="0" data-duration="4.3" data-track-index="3">
        <div id="a-c3" class="a-num">3</div>
        <div id="a-c2" class="a-num">2</div>
        <div id="a-c1" class="a-num">1</div>
      </div>

      <!-- Permanent context once the question leaves -->
      <div id="a-ctx" class="a-text clip" data-start="4.15" data-duration="12.75" data-track-index="4"><span id="a-ctx-in"></span></div>
      <div id="a-source" class="a-text clip" data-start="4.3" data-duration="12.6" data-track-index="5"><span id="a-source-in"></span></div>

      <div id="a-l1" class="a-text clip" data-start="5.1" data-duration="2.6" data-track-index="6"></div>
      <div id="a-tag" class="a-text clip" data-start="6.9" data-duration="1.6" data-track-index="7"><span id="a-tag-in"></span></div>
      <svg id="a-tag-arrow" class="clip a-arrow" data-start="6.9" data-duration="1.6" data-track-index="8" viewBox="0 0 1080 1920">
        <path id="a-tag-arrow-path" fill="none" stroke="#2D1810" stroke-width="6" stroke-linecap="round" />
        <path id="a-tag-arrow-head" fill="none" stroke="#2D1810" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div id="a-l2" class="a-text clip" data-start="7.6" data-duration="2.8" data-track-index="6"></div>

      <div id="a-ans" class="a-text clip" data-start="10.35" data-duration="6.55" data-track-index="9">
        <div id="a-ans-num"></div>
        <div id="a-ans-unit"></div>
      </div>
      <div id="a-fact" class="a-text clip" data-start="11.6" data-duration="5.3" data-track-index="10"><span id="a-fact-in"></span></div>
      <div id="a-exact-label" class="a-text clip" data-start="13.0" data-duration="3.9" data-track-index="11"></div>
      <svg id="a-exact-arrow" class="clip a-arrow" data-start="13.0" data-duration="3.9" data-track-index="12" viewBox="0 0 1080 1920">
        <path id="a-exact-arrow-path" fill="none" stroke="#2D1810" stroke-width="6" stroke-linecap="round" />
        <path id="a-exact-arrow-head" fill="none" stroke="#2D1810" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V;
      const LOG = V.scale === "log";
      const T = LOG ? Math.log10 : (x) => x;
      const GUESSES = String(V.guesses).split(",").map(Number).filter((g) => Number.isFinite(g) && (!LOG || g > 0));
      const v1 = [T(V.view1Lo), T(V.view1Hi)], v2 = [T(V.view2Lo), T(V.view2Hi)];
      const PULL = !!V.pull;

      const X0 = 90, AXW = 810, AXY = 1230, S = 60, FOOT = 8.4, COLS = 26;
      const view = { lo: v1[0], hi: v1[1] };
      const step = (v1[1] - v1[0]) / COLS;
      const binOf = (g) => Math.round(T(g) / step) * step;      // columns at the opening view's resolution
      const xAt = (t, lo, hi) => X0 + ((t - lo) / (hi - lo)) * AXW;
      const isPink = V.hiliteMode === "exact" ? (g) => g === V.answer
        : V.hiliteMode === "close" ? (g) => g >= V.closeLo && g <= V.closeHi : () => false;

      // Seeded shuffle (mulberry32) so every render drops the herd in the same order
      let seed = 7;
      const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const order = GUESSES.map((v, i) => i);
      for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

      // Stacks: each column's height is capped at 300 px however big the herd
      const counts = {};
      GUESSES.forEach((g) => { const b = binOf(g); counts[b] = (counts[b] || 0) + 1; });
      const tallest = Math.max(1, ...Object.values(counts));
      const SP = Math.min(13, 300 / Math.max(1, tallest - 1));

      const herd = document.getElementById("a-herd");
      const stackCount = {};
      const sheep = [];
      order.forEach((gi, n) => {
        const g = GUESSES[gi];
        const bt = binOf(g);
        const j = (stackCount[bt] = (stackCount[bt] || 0) + 1) - 1;
        const el = document.createElement("div");
        el.className = "a-sheep";
        el.style.top = (AXY - S + FOOT - j * SP) + "px";
        el.style.zIndex = String(200 - j);
        herd.appendChild(el);
        const land = 4.75 + 2.2 * Math.pow(n / Math.max(1, order.length - 1), 0.85);
        const pink = isPink(g);
        sheep.push({ el, bt, j, land, pink, jx: pink ? 0 : Math.round((rand() - 0.5) * 16) });
      });
      // The highlighted guesses get pink twins for the payoff
      const pinks = sheep.filter((s) => s.pink).map((s) => {
        const p = document.createElement("div");
        p.className = "a-sheep pink";
        p.style.top = s.el.style.top; p.style.zIndex = "300";
        herd.appendChild(p);
        return { el: p, of: s };
      });

      // Ticks: set 1 for the opening view, set 2 for the reveal view
      const ticksEl = document.getElementById("a-ticks");
      const parseTicks = (s, set) => String(s || "").split(";").filter(Boolean).map((pair) => {
        const i = pair.indexOf(":");
        const v = Number(pair.slice(0, i));
        const t = document.createElement("div"); t.className = "a-tick a-set" + set; ticksEl.appendChild(t);
        const l = document.createElement("div"); l.className = "a-tick-label a-set" + set; l.textContent = pair.slice(i + 1); ticksEl.appendChild(l);
        gsap.set(l, { xPercent: -50 });   // once, here: a percent set inside onUpdate measures the DOM every frame
        return { t: T(v), tick: t, label: l };
      });
      const ticks = parseTicks(V.ticks1, 1).concat(PULL ? parseTicks(V.ticks2, 2) : []);

      const inside = (x, m) => x >= X0 - m && x <= X0 + AXW + m;
      const layout = () => {
        for (const s of sheep) {
          const x = xAt(s.bt, view.lo, view.hi);
          gsap.set(s.el, { x: x - S / 2 + s.jx, opacity: inside(x, 20) ? 1 : 0 });
        }
        for (const p of pinks) gsap.set(p.el, { x: xAt(p.of.bt, view.lo, view.hi) - S / 2 });
        for (const tk of ticks) {
          const x = xAt(tk.t, view.lo, view.hi);
          const on = inside(x, 1) ? "visible" : "hidden";
          gsap.set(tk.tick, { x: x - 2, visibility: on });
          gsap.set(tk.label, { x: x, visibility: on });
        }
      };

      // Text
      const qWords = H.words("a-q", V.question, "a-w");
      document.getElementById("a-sub-in").textContent = V.hook;
      document.getElementById("a-ctx-in").textContent = V.context;
      document.getElementById("a-source-in").textContent = "Daily Guesstimate · " + V.date + " · " + H.num(V.players) + " players";
      const l1Words = H.words("a-l1", H.num(V.players) + " players guessed", "a-w");
      document.getElementById("a-tag-in").textContent = V.tag;
      const l2Words = H.words("a-l2", V.reveal, "a-w");
      document.getElementById("a-ans-num").textContent = V.answerBig;
      document.getElementById("a-ans-unit").textContent = V.answerUnit;
      document.getElementById("a-fact-in").textContent = V.fact;
      const exWords = H.words("a-exact-label", V.hilite, "a-w");

      // An arrow from a label to a point, drawn in frame coordinates
      const arrow = (pathId, headId, sx, sy, ex, ey, bend) => {
        const c1x = sx + (ex - sx) * 0.15 + bend, c1y = sy + (ey - sy) * 0.05;
        const c2x = ex - (ex - sx) * 0.05, c2y = ey - (ey - sy) * 0.6;
        document.getElementById(pathId).setAttribute("d", "M " + sx + " " + sy + " C " + c1x + " " + c1y + ", " + c2x + " " + c2y + ", " + ex + " " + ey);
        const ang = Math.atan2(ey - c2y, ex - c2x), k = 18;
        const a1 = ang + Math.PI - 0.55, a2 = ang + Math.PI + 0.55;
        document.getElementById(headId).setAttribute("d", "M " + (ex + Math.cos(a1) * k) + " " + (ey + Math.sin(a1) * k) + " L " + ex + " " + ey + " L " + (ex + Math.cos(a2) * k) + " " + (ey + Math.sin(a2) * k));
        return document.getElementById(pathId).getTotalLength();
      };
      const colTop = (bt) => AXY - S + FOOT - Math.max(0, (counts[bt] || 1) - 1) * SP;

      H.fontsReady().then(() => {
        H.fit("a-q", { max: 86, min: 58, maxH: 420 });
        H.fit("a-ctx", { max: 32, min: 28, maxH: 80 });
        H.fit("a-ans-num", { max: 240, min: 110 });
        H.fit("a-ans-unit", { max: 64, min: 36 });
        H.fit("a-fact", { max: 40, min: 30, maxH: 96 });
        H.fit("a-exact-label", { max: 52, min: 32 });
        // The source line sits under the reminder, however many lines it took
        const ctx = document.getElementById("a-ctx");
        document.getElementById("a-source").style.top = (ctx.offsetTop + ctx.offsetHeight + 6) + "px";

        // "Most said …": the tag over the median's column, its arrow down to the top of that column
        const medBin = binOf(V.median);
        const mx = xAt(medBin, v1[0], v1[1]);
        const tag = document.getElementById("a-tag");
        const tw = tag.offsetWidth;
        const tagLeft = Math.max(90, Math.min(990 - tw, mx - tw / 2));
        tag.style.left = tagLeft + "px";
        const tagLen = arrow("a-tag-arrow-path", "a-tag-arrow-head", Math.max(tagLeft + 20, Math.min(tagLeft + tw - 20, mx)), 718, mx, colTop(medBin) - 6, mx < 540 ? -40 : 40);

        // The answer's flag, where the answer is in the reveal view, standing above any column near it
        const fx = xAt(T(V.answer), v2[0], v2[1]);
        let poleTop = 930;
        for (const s of sheep) if (Math.abs(xAt(s.bt, v2[0], v2[1]) - fx) < 40) poleTop = Math.min(poleTop, AXY - S + FOOT - s.j * SP - 110);
        const pole = document.getElementById("a-pole"), pen = document.getElementById("a-pennant");
        pole.style.left = (fx - 3) + "px"; pole.style.top = poleTop + "px"; pole.style.height = (AXY - poleTop) + "px";
        pen.style.top = (poleTop + 2) + "px";
        if (fx < 300) { pen.style.left = (fx + 3) + "px"; document.getElementById("a-pennant-path").setAttribute("d", "M 0 0 L 0 86 L 116 43 Z"); }
        else pen.style.left = (fx - 114) + "px";

        // The pink sheep's arrow: from the line above to the middle of the pink group, in the reveal view
        let exLen = 0;
        if (pinks.length) {
          const px = pinks.reduce((a, p) => a + xAt(p.of.bt, v2[0], v2[1]), 0) / pinks.length;
          const py = Math.min(...pinks.map((p) => AXY - S + FOOT - p.of.j * SP)) - 8;
          const lab = document.getElementById("a-exact-label");
          const sx = Math.max(110, Math.min(90 + lab.offsetWidth - 20, px));
          exLen = arrow("a-exact-arrow-path", "a-exact-arrow-head", sx, 862, px, py, px < 540 ? 60 : -60);
        }

        const tl = gsap.timeline({ paused: true });
        layout();
        if (PULL) gsap.set(".a-set2", { opacity: 0 });
        if (pinks.length) gsap.set(pinks.map((p) => p.el), { opacity: 0 });

        // Clouds drift slowly (the world, never the titles)
        tl.fromTo("#a-cloud1", { x: 0 }, { x: 102, duration: 17, ease: "none" }, 0);
        tl.fromTo("#a-cloud2", { x: 0 }, { x: -85, duration: 17, ease: "none" }, 0);

        // Countdown: 3 is already on screen at frame 0; one count every 1.33 s while the question is read
        tl.fromTo("#a-c3", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 0.8, filter: "blur(6px)", duration: 0.12, ease: "power3.in" }, 1.21);
        tl.fromTo("#a-c2", { opacity: 0, scale: 1.3, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 1.33);
        tl.to("#a-c2", { opacity: 0, scale: 0.8, filter: "blur(6px)", duration: 0.12, ease: "power3.in" }, 2.55);
        tl.fromTo("#a-c1", { opacity: 0, scale: 1.3, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 2.67);

        // The question leaves word by word, the countdown with it
        tl.to(qWords, { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.012, ease: "power2.in" }, 3.95);
        tl.to(["#a-sub-in", "#a-c1"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 3.95);
        tl.fromTo("#a-ctx-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.2);
        tl.fromTo("#a-source-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.4);

        // The herd drops in, towers rising from the bottom of each column
        for (const s of sheep) {
          tl.fromTo(s.el, { y: -1300 }, { y: 0, duration: 0.32, ease: "power2.in" }, s.land - 0.32);
          tl.to(s.el, { scaleY: 0.84, transformOrigin: "50% 88%", duration: 0.06, ease: "power2.out" }, s.land);
          tl.to(s.el, { scaleY: 1, duration: 0.16, ease: "back.out(2.4)" }, s.land + 0.06);
        }
        tl.fromTo(l1Words, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 5.1);
        tl.fromTo("#a-tag-in", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, 6.9);
        tl.fromTo("#a-tag-arrow-path", { strokeDasharray: tagLen, strokeDashoffset: tagLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 6.95);
        tl.fromTo("#a-tag-arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 7.22);
        tl.to(l1Words, { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 7.45);

        // Hold before the payoff
        tl.fromTo(l2Words, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 7.65);
        tl.to(["#a-tag", "#a-tag-arrow"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 8.3);

        if (PULL) {
          // The camera pulls out to reach the answer; the herd collapses together
          tl.fromTo(view, { lo: v1[0], hi: v1[1] }, { lo: v2[0], hi: v2[1], duration: 1.7, ease: "power2.inOut", onUpdate: layout }, 8.6);
          tl.to(".a-set1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 8.7);
          tl.to(".a-set2", { opacity: 1, duration: 0.6, ease: "power2.out" }, 9.5);
        } else {
          // The answer is somewhere in the herd: a hop runs along it while the riser builds
          for (const s of sheep) {
            const x = xAt(s.bt, v1[0], v1[1]);
            tl.to(s.el, { keyframes: { y: [0, -18, 0] }, duration: 0.3, ease: "none" }, 8.7 + ((x - X0) / AXW) * 0.9);
          }
        }
        tl.to(l2Words, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.03, ease: "power2.in" }, 10.05);

        // The answer flag drops
        tl.fromTo("#a-flag-in", { y: -1200 }, { y: 0, duration: 0.42, ease: "power3.in" }, 9.98);
        tl.fromTo("#a-ans-num", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", transformOrigin: "0% 50%" }, 10.4);
        tl.fromTo("#a-ans-unit", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 10.7);
        tl.fromTo("#a-fact-in", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 11.6);

        // The highlighted sheep turn pink and hop
        if (pinks.length) {
          const pe = pinks.map((p) => p.el);
          tl.fromTo(pe, { opacity: 0, y: 0, scale: 1 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 13.0);
          tl.to(pe, { y: -40, scale: 1.7, transformOrigin: "50% 90%", duration: 0.16, ease: "power2.out", stagger: Math.min(0.04, 0.4 / pe.length) }, 13.0);
          tl.to(pe, { y: 0, duration: 0.24, ease: "bounce.out", stagger: Math.min(0.04, 0.4 / pe.length) }, 13.16);
