<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #c-ground {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 900px 900px at 10% 6%, #CFE6F3 0%, rgba(207, 230, 243, 0) 70%),
        radial-gradient(ellipse 1000px 1000px at 95% 98%, #FFE6A6 0%, rgba(255, 230, 166, 0) 70%),
        #FFF6E2;
    }
    #c-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(185, 204, 216, 0.35) 7px, rgba(185, 204, 216, 0) 7.5px);
      background-size: 64px 64px; background-position: 16px 24px;
    }
    .c-cloud { position: absolute; background: url("assets/img/cloud.svg") center / contain no-repeat; }
    #c-cloud1 { left: 40px; top: 120px; width: 230px; height: 115px; }
    #c-cloud2 { left: 780px; top: 1440px; width: 200px; height: 100px; }
    #c-stage { position: absolute; inset: 0; }
    .c-text { position: absolute; left: 90px; }
    .c-w { display: inline-block; }
    #c-title { top: 190px; width: 900px; font-size: 120px; font-weight: 700; line-height: 1.02; letter-spacing: -0.01em; }
    .c-line { top: 470px; width: 900px; font-family: "Quicksand", sans-serif; font-size: 42px; font-weight: 700; line-height: 1.2; }
    #c-dial { position: absolute; left: 140px; top: 590px; width: 800px; height: 420px; overflow: visible; }
    #c-needle { position: absolute; left: 532px; top: 610px; width: 16px; height: 380px; background: #2D1810; border-radius: 8px; }
    #c-hub { position: absolute; left: 460px; top: 910px; width: 160px; height: 160px; background: url("assets/img/sheep.svg") center / contain no-repeat; }
    #c-title { max-height: 260px; }
    .c-line { max-height: 108px; }
    #c-sides { position: absolute; left: 140px; top: 1012px; width: 800px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 190px; align-items: end; }  /* the gap keeps both labels clear of the sheep hub (460-620) */
    .c-side { font-family: "Quicksand", sans-serif; font-size: 38px; font-weight: 700; line-height: 1.15; max-height: 88px; overflow: hidden; }
    #c-yes-label { color: #2F6E45; }
    #c-no-label { color: #C2306F; text-align: right; }
    .c-num { margin-top: 6px; font-size: 140px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    #c-yes-num { color: #3D8B5A; }
    #c-no-num { color: #E84A8B; text-align: right; }
    .c-count { font-family: "Quicksand", sans-serif; font-size: 32px; font-weight: 700; }
    #c-no-count { text-align: right; }
    #c-source { top: 1292px; font-family: "Quicksand", sans-serif; font-size: 28px; font-weight: 600; color: rgba(45, 24, 16, 0.6); }
  </style>

  <div id="root" data-composition-id="dial" data-width="1080" data-height="1920">
    <div id="c-ground"></div>
    <div id="c-dots"></div>
    <div id="c-cloud1" class="c-cloud"></div>
    <div id="c-cloud2" class="c-cloud"></div>

    <div id="c-stage">
      <div id="c-title" class="c-text"></div>
      <div id="c-line1" class="c-text c-line clip" data-start="0" data-duration="3.3" data-track-index="1"></div>
      <div id="c-line2" class="c-text c-line clip" data-start="3.15" data-duration="4.6" data-track-index="2"></div>
      <div id="c-line3" class="c-text c-line clip" data-start="9.3" data-duration="1.75" data-track-index="3"></div>
      <div id="c-line4" class="c-text c-line clip" data-start="11.0" data-duration="2.7" data-track-index="4"></div>

      <!-- The dial: Spectrum's scale as a gauge -->
      <svg id="c-dial" viewBox="0 0 800 420">
        <path d="M 0 400 A 400 400 0 0 1 400 0 L 400 400 Z" fill="#3D8B5A" />
        <path d="M 400 0 A 400 400 0 0 1 800 400 L 400 400 Z" fill="#E84A8B" />
        <g id="c-ticks" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></g>
        <path d="M 5 400 A 395 395 0 0 1 795 400" fill="none" stroke="#2D1810" stroke-width="10" />
        <line x1="-6" y1="400" x2="806" y2="400" stroke="#2D1810" stroke-width="10" stroke-linecap="round" />
      </svg>
      <div id="c-needle"></div>
      <div id="c-hub"></div>

      <div id="c-sides">
        <div id="c-yes-label" class="c-side"></div>
        <div id="c-no-label" class="c-side"></div>
        <div id="c-yes-num" class="c-num clip" data-start="7.85" data-duration="5.95" data-track-index="5"><span id="c-yes-num-in"></span></div>
        <div id="c-no-num" class="c-num clip" data-start="8.05" data-duration="5.75" data-track-index="6"><span id="c-no-num-in"></span></div>
        <div id="c-yes-count" class="c-count clip" data-start="8.3" data-duration="5.5" data-track-index="7"><span id="c-yes-count-in"></span></div>
        <div id="c-no-count" class="c-count clip" data-start="8.3" data-duration="5.5" data-track-index="8"><span id="c-no-count-in"></span></div>
      </div>
      <div id="c-source" class="c-text clip" data-start="8.3" data-duration="5.5" data-track-index="9"><span id="c-source-in"></span></div>
    </div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V;
      const YES = V.countA, NO = V.countB, TOTAL = YES + NO;
      const P = TOTAL ? YES / TOTAL : 0.5;
      const pa = Math.round(100 * P), pb = 100 - pa;
      const FINAL = -(2 * P - 1) * 90;            // left = the first option
      // The swing never passes the dial's ends: its widest excursion is about 0.62 of the amplitude
      const AMP = Math.min(75, (88 - Math.abs(FINAL)) / 0.62);

      document.getElementById("c-title").textContent = V.prompt;
      document.getElementById("c-yes-label").textContent = V.a;
      document.getElementById("c-no-label").textContent = V.b;
      document.getElementById("c-yes-num-in").textContent = pa + "%";
      document.getElementById("c-no-num-in").textContent = pb + "%";
      document.getElementById("c-yes-count-in").textContent = H.num(YES) + (YES === 1 ? " person" : " people");
      document.getElementById("c-no-count-in").textContent = H.num(NO) + (NO === 1 ? " person" : " people");
      document.getElementById("c-source-in").textContent = "Daily Hot Takes · " + V.date + " · " + H.num(TOTAL) + " players";

      // Tick marks every 10% of the scale
      const ticks = document.getElementById("c-ticks");
      for (let i = 1; i < 10; i++) {
        const a = Math.PI - (i / 10) * Math.PI;
        const x1 = 400 + Math.cos(a) * 330, y1 = 400 - Math.sin(a) * 330;
        const x2 = 400 + Math.cos(a) * 372, y2 = 400 - Math.sin(a) * 372;
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        if (i === 5) l.setAttribute("stroke-width", "10");
        ticks.appendChild(l);
      }

      const w1 = H.words("c-line1", V.line1, "c-w");
      const w2 = H.words("c-line2", V.line2, "c-w");
      const w3 = H.words("c-line3", V.line3, "c-w");
      const w4 = H.words("c-line4", V.line4, "c-w");

      H.fontsReady().then(() => {
        H.fit("c-title", { max: 120, min: 72, maxH: 260 });
        ["c-line1", "c-line2", "c-line3", "c-line4"].forEach((id) => H.fit(id, { max: 42, min: 30, maxH: 108 }));
        ["c-yes-label", "c-no-label"].forEach((id) => H.fit(id, { max: 38, min: 28, maxH: 88 }));
        // The source line sits under the vote columns, however many lines the options took
        // (worked out, not measured: the shares and counts are clips, hidden until they land)
        const labelH = Math.max(document.getElementById("c-yes-label").offsetHeight, document.getElementById("c-no-label").offsetHeight);
        document.getElementById("c-source").style.top = (1012 + labelH + 6 + 140 + 40 + 14) + "px";

        // The needle: a damped swing (closed form of t), already moving at frame 0, settling by 7.6 s.
        // It crosses its resting point every 1.31 s whatever the result, so the ticks stay on it.
        const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
        const angleAt = (t) => FINAL + AMP * Math.exp(-0.6 * t) * Math.cos(2.4 * t + 0.9) * (1 - smooth(6.6, 7.6, t));
        const clock = { t: 0 };
        const setNeedle = () => gsap.set("#c-needle", { rotation: angleAt(clock.t), transformOrigin: "50% 100%" });

        const tl = gsap.timeline({ paused: true });
        setNeedle();
        tl.fromTo(clock, { t: 0 }, { t: 7.6, duration: 7.6, ease: "none", onUpdate: setNeedle }, 0);

        // Clouds drift (the world)
        tl.fromTo("#c-cloud1", { x: 0 }, { x: 83, duration: 13.8, ease: "none" }, 0);
        tl.fromTo("#c-cloud2", { x: 0 }, { x: -69, duration: 13.8, ease: "none" }, 0);

        // Lines under the title (frame 0 already shows line 1)
        tl.to(w1, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.02, ease: "power2.in" }, 3.0);
        tl.fromTo(w2, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 3.2);
        tl.to(w2, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.02, ease: "power2.in" }, 7.5);

        // Settled: the split lands under each side
        tl.fromTo("#c-yes-num-in", { opacity: 0, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", transformOrigin: "0% 50%" }, 7.85);
        tl.fromTo("#c-no-num-in", { opacity: 0, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", transformOrigin: "100% 50%" }, 8.05);
        tl.fromTo(["#c-yes-count-in", "#c-no-count-in", "#c-source-in"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.3);
        tl.fromTo(w3, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 9.35);
        tl.to(w3, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.02, ease: "power2.in" }, 10.85);
        tl.fromTo(w4, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 11.05);

        // Hand-off to the end card
        tl.to("#c-stage", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 13.4);

        window.__timelines["dial"] = tl;
      });
    })();
  </script>
</template>
