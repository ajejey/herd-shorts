<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #c-world, #c-stage, #c-front { position: absolute; inset: 0; }
    #c-label { color: #C2306F; }
    /* The dial: the two options as halves of a gauge */
    #c-dial { position: absolute; left: 140px; top: 600px; width: 800px; height: 420px; overflow: visible; }
    #c-needle { position: absolute; left: 532px; top: 620px; width: 16px; height: 380px; background: #2D1810; border-radius: 8px; }
    #c-hub { position: absolute; left: 470px; top: 930px; width: 140px; height: 140px; background: url("assets/img/sheep.svg") center / contain no-repeat; }
    /* Each side: its option (up to two lines) over its share; the gap keeps both clear of the hub */
    #c-sides { position: absolute; left: 60px; top: 1036px; width: 960px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 200px; align-items: end; }
    .c-side { font-family: "Fredoka", sans-serif; font-size: 50px; font-weight: 700; line-height: 1.1; }
    #c-a { color: #2F6E45; } #c-b { color: #C2306F; text-align: right; }
    .c-pct { font-size: 120px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    #c-pa { color: #3D8B5A; } #c-pb { color: #E84A8B; text-align: right; }
  </style>

  <div id="root" data-composition-id="scene" data-width="1080" data-height="1920">
    <div id="c-world"></div>
    <div id="c-stage">
      <svg id="c-dial" viewBox="0 0 800 420">
        <path d="M 0 400 A 400 400 0 0 1 400 0 L 400 400 Z" fill="#3D8B5A" />
        <path d="M 400 0 A 400 400 0 0 1 800 400 L 400 400 Z" fill="#E84A8B" />
        <g id="c-ticks" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></g>
        <path d="M 5 400 A 395 395 0 0 1 795 400" fill="none" stroke="#2D1810" stroke-width="10" />
        <line x1="-6" y1="400" x2="806" y2="400" stroke="#2D1810" stroke-width="10" stroke-linecap="round" />
      </svg>
      <div id="c-needle"></div>
      <div id="c-hub"></div>
      <div id="c-sides">
        <div id="c-a" class="c-side"></div>
        <div id="c-b" class="c-side"></div>
        <div id="c-pa" class="c-pct"><span id="c-pa-in"></span></div>
        <div id="c-pb" class="c-pct"><span id="c-pb-in"></span></div>
      </div>
    </div>
    <div id="c-front"></div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V, K = H.kit(), A = K.anim;
      const T = { count: 1.1, swing: 4.4, settle: 8.6, hold: 8.6, reveal: 9.9, sting: 10.6, ask: 11.1, play: 13.2, rewind: 15.3, end: 16.1 };
      const YES = V.countA, NO = V.countB, TOTAL = YES + NO;
      const P = TOTAL ? YES / TOTAL : 0.5;
      const pa = Math.round(100 * P), pb = 100 - pa;
      const FINAL = -(2 * P - 1) * 90;                       // left = the first option
      const AMP = Math.min(75, (88 - Math.abs(FINAL)) / 0.62); // the widest swing stays on the dial
      const K7 = 7.6 / (T.settle - T.swing);                 // the swing curve's own clock

      const world = K.world(document.getElementById("c-world"));
      const front = document.getElementById("c-front");
      const hookEl = document.createElement("div");
      hookEl.className = "hk-c hk-hook";
      hookEl.innerHTML = '<div><div id="c-label"></div><div id="c-q"></div></div>';
      front.appendChild(hookEl);
      const labelW = H.words(document.getElementById("c-label"), V.label, "hk-w");
      const qW = H.words(document.getElementById("c-q"), V.prompt, "hk-w");
      const hookSpans = Array.from(labelW).concat(Array.from(qW));
      const sTurn = K.slot(front, V.turn), sHerd = K.slot(front, V.herd), sHold = K.slot(front, V.hold), sAns = K.slot(front, V.verdict, true);
      [sTurn, sHerd, sHold, sAns].forEach((s) => { s.el.style.height = "110px"; });
      const host = K.host(front);
      const stat1 = K.stat(front), stat2 = K.stat(front);
      K.statText(stat1, "<b>" + H.num(TOTAL) + "</b> players voted", false);
      K.statText(stat2, K.pick(V.sting), true);
      gsap.set([stat1, stat2], { visibility: "hidden" });
      const ask = K.ask(front, V.ask);
      const banner = K.banner(front, V.play, V.url);
      const winLeft = YES >= NO;
      const bits = K.confetti(front, winLeft ? 330 : 750, 820, 40, 9);
      const ring = K.ring(front, 415, 640, 250);

      document.getElementById("c-a").textContent = V.a;
      document.getElementById("c-b").textContent = V.b;
      document.getElementById("c-pa-in").textContent = pa + "%";
      document.getElementById("c-pb-in").textContent = pb + "%";
      const ticks = document.getElementById("c-ticks");
      for (let i = 1; i < 10; i++) {
        const ang = Math.PI - (i / 10) * Math.PI;
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", 400 + Math.cos(ang) * 330); l.setAttribute("y1", 400 - Math.sin(ang) * 330);
        l.setAttribute("x2", 400 + Math.cos(ang) * 372); l.setAttribute("y2", 400 - Math.sin(ang) * 372);
        if (i === 5) l.setAttribute("stroke-width", "10");
        ticks.appendChild(l);
      }

      // The needle as a function of time: resting, swinging to the herd's split, settled, then back to the middle
      const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      const angleAt = (t) => {
        if (t < T.swing) return 4 * Math.sin(t * 2.2);
        if (t < T.rewind) { const tp = (t - T.swing) * K7; return FINAL + AMP * Math.exp(-0.6 * tp) * Math.cos(2.4 * tp + 0.9) * (1 - smooth(6.6, 7.6, tp)); }
        return FINAL * (1 - smooth(T.rewind, T.rewind + 0.5, t));
      };
      const clock = { t: 0 };
      const setNeedle = () => gsap.set("#c-needle", { rotation: angleAt(clock.t), transformOrigin: "50% 100%" });

      H.fontsReady().then(() => {
        H.fit(hookEl, { max: 84, min: 52, maxH: 200 });
        [sTurn, sHerd, sHold].forEach((s) => H.fit(s.el, { max: 68, min: 44, maxH: 110 }));
        H.fit(sAns.el, { max: 96, min: 52 });
        ["c-a", "c-b"].forEach((id) => H.fit(id, { max: 50, min: 34, maxH: 112 }));   // the two choices: the biggest thing after the take
        H.fit(stat2, { max: 46, min: 32 });
        H.fit(ask.el, { max: 56, min: 34 });
        H.fit(banner.url, { max: 92, min: 56 });

        const tl = gsap.timeline({ paused: true });
        setNeedle();
        tl.fromTo(clock, { t: 0 }, { t: T.end, duration: T.end, ease: "none", onUpdate: setNeedle }, 0);
        gsap.set(["#c-pa-in", "#c-pb-in"], { opacity: 0 });

        A.world(tl, world, T);
        A.host(tl, host, T);
        A.popIn(tl, hookSpans, 0.02, { stagger: 0.07 });

        // Your turn: pick a side before the ring runs out
        A.slot(tl, sTurn, 0.9, T.swing - 0.05);
        A.ring(tl, ring, T.count, 3);
        tl.fromTo(["#c-a", "#c-b"], { scale: 1 }, { keyframes: { scale: [1, 1.12, 1] }, duration: 0.4, ease: "none", stagger: 0.25, transformOrigin: "50% 50%" }, 1.3);

        // Where did the herd land? (the needle swings and settles)
        A.slot(tl, sHerd, T.swing, T.settle);
        tl.set(stat1, { visibility: "visible" }, T.swing);
        tl.fromTo(stat1, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, T.swing);
        A.slot(tl, sHold, T.hold, T.reveal - 0.1);

        // The reveal: the split slams in under each side, the verdict lands, confetti from the winning side
        tl.fromTo("#c-pa-in", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", transformOrigin: "0% 50%" }, T.reveal);
        tl.fromTo("#c-pb-in", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", transformOrigin: "100% 50%" }, T.reveal + 0.1);
        A.slot(tl, sAns, T.reveal, T.rewind + 0.15, true);
        A.burst(tl, bits, T.reveal);

        tl.set(stat1, { visibility: "hidden" }, T.sting);
        tl.set(stat2, { visibility: "visible" }, T.sting);
        tl.fromTo(stat2, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, T.sting);
        tl.set(ask.el, { visibility: "visible" }, T.ask);
        tl.fromTo(ask.spans, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.22, stagger: 0.05, ease: "back.out(1.6)" }, T.ask);
        tl.to(ask.spans, { opacity: 0, duration: 0.12 }, T.play - 0.1);
        tl.set(ask.el, { visibility: "hidden" }, T.play);
        A.banner(tl, banner, T, [stat2, host.cow, host.bubble]);

        // Rewind: the needle goes back to the middle, the shares and the challenge go
        tl.set(stat2, { visibility: "hidden" }, T.rewind + 0.15);
        tl.to(["#c-pa-in", "#c-pb-in"], { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, T.rewind);
        A.popOut(tl, hookSpans, T.end - 0.42);

        window.__timelines["scene"] = tl;
      });
    })();
  </script>
</template>
