<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"date","type":"string","label":"date","default":"9 Nov 2026"},
    {"id":"label","type":"string","label":"label","default":"Pick a side:"},
    {"id":"prompt","type":"string","label":"prompt","default":"Snooze button?"},
    {"id":"a","type":"string","label":"a","default":"Up at the first alarm"},
    {"id":"b","type":"string","label":"b","default":"Snooze five times"},
    {"id":"countA","type":"number","label":"countA","default":343},
    {"id":"countB","type":"number","label":"countB","default":332},
    {"id":"turn","type":"string","label":"turn","default":"Quick, pick one!"},
    {"id":"herd","type":"string","label":"herd","default":"Where did the herd land?"},
    {"id":"hold","type":"string","label":"hold","default":"The herd says…"},
    {"id":"verdict","type":"string","label":"verdict","default":"Split almost in half!"},
    {"id":"players","type":"number","label":"players","default":675},
    {"id":"sting","type":"string","label":"sting","default":"Only 11 votes apart"},
    {"id":"insight","type":"string","label":"insight","default":"The most divided take of the day"},
    {"id":"ask","type":"string","label":"ask","default":"Which side are you on?"},
    {"id":"play","type":"string","label":"play","default":"Play today’s Hot Takes free"},
    {"id":"url","type":"string","label":"url","default":"herdgamesonline.com"},
    {"id":"swingTicks","type":"string","label":"swingTicks","default":"4.554,5.278,6.001,6.725,7.448"},
    {"id":"theme","type":"enum","label":"World","default":"beach","options":[{"value":"meadow","label":"meadow"},{"value":"sunset","label":"sunset"},{"value":"snow","label":"snow"},{"value":"beach","label":"beach"},{"value":"autumn","label":"autumn"},{"value":"spring","label":"spring"}]},
    {"id":"party","type":"enum","label":"Celebration at the reveal","default":"confetti","options":[{"value":"confetti","label":"confetti"},{"value":"stars","label":"stars"},{"value":"stampede","label":"stampede"}]},
    {"id":"react","type":"enum","label":"The cow at the reveal","default":"spin","options":[{"value":"jump","label":"jump"},{"value":"spin","label":"spin"},{"value":"dance","label":"dance"}]},
    {"id":"music","type":"string","label":"Music bed (file in assets/shared/music)","default":"funk-clav"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #E9F4E8; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.1" data-width="1080" data-height="1920">
      <div id="scene" data-composition-id="scene" data-composition-src="compositions/scene.html"
        data-start="0" data-duration="16.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sound (strategy/PRINCIPLES.md rule 6), written by pipeline/make-root.mjs from the format's beat clock -->
      <audio id="mus-a" data-music="1" class="clip" src="assets/shared/music/funk-clav.mp3" data-start="0" data-duration="1.1" data-track-index="30" data-volume="0.55" data-fade-out="0.12"></audio>
      <audio id="mus-b" data-music="1" class="clip" src="assets/shared/music/funk-clav.mp3" data-start="1.1" data-media-start="1.1" data-duration="3" data-track-index="31" data-volume="0.22" data-fade-in="0.1" data-fade-out="0.1"></audio>
      <audio id="mus-c" data-music="1" class="clip" src="assets/shared/music/funk-clav.mp3" data-start="4.1" data-media-start="4.1" data-duration="5.65" data-track-index="33" data-volume="0.45" data-fade-in="0.1" data-fade-out="0.1"></audio>
      <audio id="mus-d" data-music="1" class="clip" src="assets/shared/music/funk-clav.mp3" data-start="9.9" data-media-start="9.9" data-duration="6.2" data-track-index="32" data-volume="0.55" data-fade-out="0.35"></audio>
      <audio id="snd-beep3" class="clip" src="assets/shared/sfx/beep-1.mp3" data-start="1.1" data-duration="0.67" data-track-index="12" data-volume="0.55"></audio>
      <audio id="snd-beep2" class="clip" src="assets/shared/sfx/beep-1.mp3" data-start="2.1" data-duration="0.67" data-track-index="12" data-volume="0.55"></audio>
      <audio id="snd-beep1" class="clip" src="assets/shared/sfx/beep-1.mp3" data-start="3.1" data-duration="0.67" data-track-index="12" data-volume="0.6"></audio>
      <audio id="snd-tick1" class="clip" src="assets/shared/sfx/tick-1.mp3" data-start="1.6" data-duration="0.443" data-track-index="13" data-volume="0.6"></audio>
      <audio id="snd-tick2" class="clip" src="assets/shared/sfx/tick-2.mp3" data-start="2.6" data-duration="0.103" data-track-index="13" data-volume="0.6"></audio>
      <audio id="snd-tick3" class="clip" src="assets/shared/sfx/tick-1.mp3" data-start="3.6" data-duration="0.443" data-track-index="13" data-volume="0.6"></audio>
      <audio id="snd-build" class="clip" src="assets/shared/sfx/build-1.mp3" data-start="6.65" data-duration="3.15" data-track-index="14" data-volume="0.35" data-fade-out="0.1"></audio>

      <audio id="snd-swing" data-each="swingTicks" data-rotate="assets/shared/sfx/tick-1.mp3|assets/shared/sfx/tick-3.mp3" class="clip" src="assets/shared/sfx/tick-1.mp3" data-start="4.5" data-duration="0.443" data-track-index="23" data-volume="0.6"></audio>
      <audio id="snd-swing-go" class="clip" src="assets/shared/sfx/whoosh-2.mp3" data-start="4.4" data-duration="0.307" data-track-index="24" data-volume="0.5"></audio>
    </div>
    <script src="assets/herd.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
