<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"date","type":"string","label":"Board date","default":"4 Nov 2026"},
    {"id":"question","type":"string","label":"Question","default":"Name something that always breaks in an office."},
    {"id":"hook","type":"string","label":"Hook (under the question)","default":"3,071 people answered. Can you name #1?"},
    {"id":"hold","type":"string","label":"Line before #1","default":"And the #1 answer…"},
    {"id":"ans1","type":"string","label":"Answer #1","default":"Printer"},
    {"id":"pct1","type":"number","label":"Answer #1 %","default":38},
    {"id":"ans2","type":"string","label":"Answer #2","default":"Computer"},
    {"id":"pct2","type":"number","label":"Answer #2 %","default":8},
    {"id":"ans3","type":"string","label":"Answer #3","default":"Mugs"},
    {"id":"pct3","type":"number","label":"Answer #3 %","default":8},
    {"id":"ans4","type":"string","label":"Answer #4","default":"Stapler"},
    {"id":"pct4","type":"number","label":"Answer #4 %","default":6},
    {"id":"ans5","type":"string","label":"Answer #5","default":"Chair"},
    {"id":"pct5","type":"number","label":"Answer #5 %","default":5},
    {"id":"ans6","type":"string","label":"Answer #6","default":"Coffee machine"},
    {"id":"pct6","type":"number","label":"Answer #6 %","default":5},
    {"id":"ans7","type":"string","label":"Answer #7","default":"Copier"},
    {"id":"pct7","type":"number","label":"Answer #7 %","default":4},
    {"id":"ans8","type":"string","label":"Answer #8","default":"Pencil"},
    {"id":"pct8","type":"number","label":"Answer #8 %","default":4},
    {"id":"count1","type":"number","label":"People who said #1","default":1155},
    {"id":"total","type":"number","label":"People who answered","default":3071},
    {"id":"gag","type":"string","label":"Payoff joke (blank: none)","default":"Of course it’s the printer."},
    {"id":"endHead","type":"string","label":"End card headline","default":"Play today’s board"},
    {"id":"endGame","type":"string","label":"End card game line","default":"Top Answers · a new board every day"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF8E7; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1080" data-height="1920">
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html"
        data-start="0" data-duration="15" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="14.6" data-duration="3.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Sound: no music bed (no source); effects only, each peak one frame after its picture -->
      <audio id="snd-flip8" data-if="ans8" class="clip" src="assets/sfx/sfx_006.mp3" data-start="2.619" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-flip7" data-if="ans7" class="clip" src="assets/sfx/sfx_005.mp3" data-start="3.151" data-duration="0.59" data-track-index="11" data-volume="0.8"></audio>
      <audio id="snd-flip6" class="clip" src="assets/sfx/sfx_006.mp3" data-start="4.219" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-flip5" class="clip" src="assets/sfx/sfx_005.mp3" data-start="4.751" data-duration="0.59" data-track-index="11" data-volume="0.8"></audio>
      <audio id="snd-flip4" class="clip" src="assets/sfx/sfx_006.mp3" data-start="5.819" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-flip3" class="clip" src="assets/sfx/sfx_005.mp3" data-start="6.351" data-duration="0.59" data-track-index="11" data-volume="0.8"></audio>
      <audio id="snd-flip2" class="clip" src="assets/sfx/sfx_006.mp3" data-start="7.419" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-riser" class="clip" src="assets/sfx/sfx_002.mp3" data-start="7.598" data-duration="2" data-track-index="12" data-volume="0.55"></audio>
      <audio id="snd-flip1" class="clip" src="assets/sfx/sfx_005.mp3" data-start="9.151" data-duration="0.59" data-track-index="11" data-volume="0.8"></audio>
      <audio id="snd-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="9.5" data-duration="2.1" data-track-index="13" data-volume="0.9"></audio>
      <audio id="snd-flood" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.27" data-duration="0.575" data-track-index="14" data-volume="0.8"></audio>
      <audio id="snd-gag" class="clip" src="assets/sfx/pop.mp3" data-start="12.51" data-duration="0.6" data-track-index="15" data-volume="0.7"></audio>
      <audio id="snd-end-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.85" data-duration="0.575" data-track-index="14" data-volume="0.6"></audio>
      <audio id="snd-end-pop" class="clip" src="assets/sfx/pop.mp3" data-start="15.813" data-duration="0.6" data-track-index="15" data-volume="0.7"></audio>
    </div>
    <script src="assets/herd.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
