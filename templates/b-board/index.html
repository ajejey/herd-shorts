<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Text","default":"#2D1810"},
    {"id":"color-accent","type":"color","label":"Accent (board, payoff)","default":"#E84A8B"},
    {"id":"color-green","type":"color","label":"Link green","default":"#3D8B5A"},
    {"id":"font-display","type":"string","label":"Display font","default":"Fredoka"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF8E7; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1080" data-height="1920">

        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="14.6" data-duration="3.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Sound: no music bed (no source); effects only, each peak one frame after its picture -->
      <audio id="snd-flip8" class="clip" src="assets/sfx/sfx_006.mp3" data-start="2.619" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>
      <audio id="snd-flip7" class="clip" src="assets/sfx/sfx_005.mp3" data-start="3.151" data-duration="0.59" data-track-index="11" data-volume="0.8"></audio>

      <audio id="snd-flip4" class="clip" src="assets/sfx/sfx_006.mp3" data-start="5.819" data-duration="0.75" data-track-index="10" data-volume="0.7"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

</html>
