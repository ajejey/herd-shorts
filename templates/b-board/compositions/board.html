<template>
  <style>
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Quicksand"; src: url("assets/fonts/quicksand.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #2D1810; font-family: "Fredoka", sans-serif; }
    #b-ground { position: absolute; inset: 0; background: #FFF8E7; }
    #b-dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(232, 214, 184, 0.6) 7px, rgba(232, 214, 184, 0) 7.5px);
      background-size: 64px 64px; background-position: 16px 24px;
    }
    #b-stage { position: absolute; inset: 0; }
    #b-card {
      position: absolute; left: 70px; top: 196px; width: 940px; height: 1104px;
      background: #FFFFFF; border: 4px solid #F6C9DA; border-radius: 40px;
      box-shadow: 0 10px 0 rgba(232, 74, 139, 0.12);
    }
    .b-text { position: absolute; left: 110px; }
    .b-w { display: inline-block; }
    #b-kicker { top: 232px; font-family: "Quicksand", sans-serif; font-size: 30px; font-weight: 700; color: #E84A8B; letter-spacing: 0.04em; }
    #b-q { top: 280px; width: 860px; max-height: 160px; font-size: 72px; font-weight: 700; line-height: 1.08; }
    #b-sub, #b-hold { top: 452px; font-family: "Quicksand", sans-serif; font-size: 38px; font-weight: 700; }
    #b-tiles { position: absolute; left: 110px; top: 528px; width: 860px; }
    .b-tile { position: absolute; left: 0; width: 860px; height: 80px; perspective: 900px; }
    .b-face, .b-blank {
      position: absolute; inset: 0; border-radius: 22px; display: flex; align-items: center;
      backface-visibility: hidden;
    }
    .b-blank { background: #FFF6EC; border: 3px solid #F8E3D2; }
    .b-face { background: #FFE6F0; border: 3px solid #F6C9DA; }
    .b-num {
      width: 56px; height: 56px; margin-left: 12px; border-radius: 28px; background: #E84A8B; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; flex: none;
    }
    .b-ans { margin-left: 22px; font-size: 44px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
    .b-pct { margin-right: 26px; font-family: "Quicksand", sans-serif; font-size: 42px; font-weight: 700; }
    #b-flood { position: absolute; inset: 0; background: #E84A8B; }
    .b-pay { position: absolute; left: 90px; color: #FFFFFF; }
    #b-pay-kicker { top: 250px; font-family: "Quicksand", sans-serif; font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.86); }
    #b-pay-word { top: 300px; width: 900px; white-space: nowrap; font-size: 170px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
    #b-pay-pct { top: 470px; font-size: 330px; font-weight: 700; line-height: 1; color: #FFF8E7; letter-spacing: -0.02em; }
    #b-crown { position: absolute; left: 90px; top: 840px; width: 260px; height: 260px; }
    #b-pay-count { top: 880px; left: 400px; width: 560px; font-family: "Quicksand", sans-serif; font-size: 46px; font-weight: 700; line-height: 1.2; }
    #b-pay-gag { top: 1150px; width: 900px; font-size: 64px; font-weight: 600; line-height: 1.1; }
  </style>

  <div id="root" data-composition-id="board" data-width="1080" data-height="1920">
    <div id="b-ground"></div>
    <div id="b-dots"></div>

    <div id="b-stage">
      <div id="b-card"></div>
      <div id="b-kicker" class="b-text"></div>
      <div id="b-q" class="b-text"></div>
      <div id="b-sub" class="b-text clip" data-start="0" data-duration="8.25" data-track-index="1"><span id="b-sub-in"></span></div>
      <div id="b-hold" class="b-text clip" data-start="8.2" data-duration="1.9" data-track-index="2"></div>
      <div id="b-tiles"></div>
    </div>

    <!-- The #1 tile becomes the world -->
    <div id="b-flood" class="clip" data-start="10.0" data-duration="5.0" data-track-index="3"></div>
    <div id="b-pay-kicker" class="b-pay clip" data-start="10.5" data-duration="4.5" data-track-index="4"><span id="b-pay-kicker-in">The #1 answer</span></div>
    <div id="b-pay-word" class="b-pay clip" data-start="10.45" data-duration="4.55" data-track-index="5"><span id="b-pay-word-in"></span></div>
    <div id="b-pay-pct" class="b-pay clip" data-start="10.6" data-duration="4.4" data-track-index="6"><span id="b-pay-pct-in"></span></div>
    <svg id="b-crown" class="clip" data-start="11.0" data-duration="4.0" data-track-index="7" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path id="b-cr-body" d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" />
      <path id="b-cr-base" d="M5 21h14" />
    </svg>
    <div id="b-pay-count" class="b-pay clip" data-start="11.2" data-duration="3.8" data-track-index="8"><span id="b-pay-count-in"></span></div>
    <div id="b-pay-gag" class="b-pay clip" data-start="12.6" data-duration="2.4" data-track-index="9"></div>
  </div>

  <script>
    (function () {
      // ---- DATA: the video's variables (index.html), filled per day by pipeline/build.mjs ----
      const H = window.HERD, V = H.V;
      const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
      const TILES = [];
      for (let i = 1; i <= 8; i++) if (V["ans" + i]) TILES.push([cap(V["ans" + i]), V["pct" + i]]);
      const N = TILES.length;
      const TILE_H = 80, GAP = 12;

      document.getElementById("b-kicker").textContent = ("Top Answers · " + V.date).toUpperCase();
      document.getElementById("b-q").textContent = V.question;
      document.getElementById("b-sub-in").textContent = V.hook;
      document.getElementById("b-pay-word-in").textContent = TILES[0][0];
      document.getElementById("b-pay-pct-in").textContent = TILES[0][1] + "%";
      document.getElementById("b-pay-count-in").innerHTML = H.num(V.count1) + " of " + H.num(V.total) + "<br />people said it";

      const tilesEl = document.getElementById("b-tiles");
      const tiles = TILES.map(([ans, pct], i) => {
        const t = document.createElement("div");
        t.className = "b-tile";
        t.id = "b-tile-" + (i + 1);
        t.style.top = i * (TILE_H + GAP) + "px";
        t.innerHTML =
          '<div class="b-blank"><div class="b-num">' + (i + 1) + "</div></div>" +
          '<div class="b-face"><div class="b-num">' + (i + 1) + '</div><div class="b-ans"></div><div class="b-pct">' + pct + "%</div></div>";
        t.querySelector(".b-ans").textContent = ans;
        tilesEl.appendChild(t);
        return { t, blank: t.querySelector(".b-blank"), face: t.querySelector(".b-face"), ans: t.querySelector(".b-ans") };
      });
      // The card ends 48 px under the last answer (a full board of 8 keeps the original 1,104 px)
      document.getElementById("b-card").style.height = Math.min(1104, 528 + N * (TILE_H + GAP) - GAP + 48 - 196) + "px";
      const holdWords = H.words("b-hold", V.hold, "b-w");
      const gagWords = V.gag ? H.words("b-pay-gag", V.gag, "b-w") : [];

      H.fontsReady().then(() => {
        H.fit("b-q", { max: 72, min: 46, maxH: 160 });
        tiles.forEach((x) => H.fit(x.ans, { max: 44, min: 28 }));
        H.fit("b-pay-word", { max: 170, min: 72 });

        const tl = gsap.timeline({ paused: true });
        tiles.forEach((x) => gsap.set(x.face, { rotationX: 90 }));

        // Flip one tile: the blank folds away, the answer swings in
        const flip = (i, t) => {
          tl.fromTo(tiles[i].blank, { rotationX: 0 }, { rotationX: -90, duration: 0.14, ease: "power2.in" }, t);
          tl.fromTo(tiles[i].face, { rotationX: 90 }, { rotationX: 0, duration: 0.24, ease: "back.out(1.6)" }, t + 0.14);
        };
        // The last answer up to #2, one every 0.8 s; #k always flips in its own slot (the sounds are timed to it)
        const slot = (i) => 2.6 + (7 - i) * 0.8;
        for (let i = N - 1; i >= 1; i--) flip(i, slot(i));

        // A ripple down the blank board while people think; again if a short board starts flipping late
        const ripple = (t) => tl.fromTo(tiles.map((x) => x.blank), { scale: 1 }, { keyframes: { scale: [1, 1.035, 1] }, duration: 0.36, stagger: 0.07, ease: "none" }, t);
        ripple(0.5);
        if (slot(N - 1) > 3.2) ripple(slot(N - 1) - 1.6);

        // Hold before the payoff, and the #1 tile shakes
        tl.to("#b-sub-in", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 8.05);
        tl.fromTo(holdWords, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 8.25);
        tl.fromTo("#b-tile-1", { x: 0 }, { keyframes: { x: [0, -10, 9, -7, 5, -3, 0] }, duration: 0.3, ease: "none" }, 8.95);
        flip(0, 9.4);

        // The #1 tile grows into the world (object becomes the world)
        const r = { top: 528, left: 110, w: 860, h: TILE_H };
        tl.fromTo("#b-flood",
          { clipPath: "inset(" + r.top + "px " + (1080 - r.left - r.w) + "px " + (1920 - r.top - r.h) + "px " + r.left + "px round 22px)" },
          { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.65, ease: "power2.inOut" }, 10.05);
        tl.to("#b-stage", { opacity: 0, filter: "blur(15px)", duration: 0.3, ease: "power2.in" }, 10.1);

        tl.fromTo("#b-pay-word-in", { opacity: 0, scale: 1.2, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out", transformOrigin: "0% 50%" }, 10.45);
        tl.fromTo("#b-pay-kicker-in", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 10.5);
        tl.fromTo("#b-pay-pct-in", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" }, 10.6);
        // The crown draws on, then bobs
        tl.fromTo(["#b-cr-body", "#b-cr-base"], { strokeDasharray: 70, strokeDashoffset: 70 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 11.0);
        tl.to("#b-crown", { keyframes: { rotation: [0, -7, 5, -3, 0], y: [0, -10, 0, -4, 0] }, transformOrigin: "50% 90%", duration: 0.6, ease: "none" }, 11.7);
        tl.fromTo("#b-pay-count-in", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 11.2);
        if (gagWords.length) tl.fromTo(gagWords, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 12.6);

        tl.to(["#b-pay-kicker-in", "#b-pay-word-in", "#b-pay-pct-in", "#b-crown", "#b-pay-count-in", "#b-pay-gag"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 14.4);

        window.__timelines["board"] = tl;
      });
    })();
  </script>
</template>
